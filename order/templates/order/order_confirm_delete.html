{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Order</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
</head>
<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4">Delete Order</h1>

    <div class="alert alert-warning">
        <h5 class="alert-heading">Are you sure you want to delete this order?</h5>
        <p class="mb-1">
            <strong>Customer:</strong>
            {{ order.first_name }} {{ order.last_name }}
        </p>
        <p class="mb-1">
            <strong>Email:</strong> {{ order.email }}<br>
            <strong>Phone:</strong> {{ order.phone }}
        </p>
        <p class="mb-1">
            <strong>Pickup Time:</strong> {{ order.pickup|time:"g:i A" }}
        </p>
        <p class="mb-0">
            <strong>Comment:</strong> {{ order.comment }}
        </p>
    </div>

    <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
            Yes, delete this order
        </button>
        <a href="{% url 'order:order_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>

</body>
</html>
